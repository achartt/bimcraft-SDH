# Explicit residential baseline plus legacy oracle tests on every pull request and main push.
# Libraries are fetched by exact version and checked against devshell/vendor.json.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The PDF checks read their output back with poppler (pdftotext, pdfinfo, pdftoppm, pdfimages).
      - name: Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: devshell/vendor
          key: vendor-${{ hashFiles('devshell/vendor.json') }}
      # --oracles: also the copyleft reference readers some checks compare against (test-only black boxes, never shipped;
      # PROVENANCE.md). Some apps' tests need them.
      - name: Standalone residential baseline
        run: npm run test:baseline
      - name: npm test
        if: always()
        run: npm test -- --oracles
      - name: Baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f01-baseline
          path: .cc-test/baseline/
